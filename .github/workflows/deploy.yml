name: Deploy portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: poliklot-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate project
        run: npm run check

      - name: Build static site
        run: npm run build

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload release
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -p ${VPS_PORT:-22}"
          RELEASE="/opt/poliklot/releases/${GITHUB_SHA}"
          $SSH "$VPS_USER@$VPS_HOST" "mkdir -p '$RELEASE'"
          rsync -az --delete -e "$SSH" dist/ "$VPS_USER@$VPS_HOST:$RELEASE/"
          $SSH "$VPS_USER@$VPS_HOST" "ln -sfn 'releases/${GITHUB_SHA}' /opt/poliklot/current && find /opt/poliklot/releases -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\n' | sort -nr | tail -n +6 | cut -d' ' -f2- | xargs -r rm -rf"

      - name: Verify production
        run: |
          curl --fail --retry 6 --retry-delay 5 --max-time 15 https://poliklot.ru/
          curl --fail --retry 6 --retry-delay 5 --max-time 15 https://poliklot.ru/articles/mobile-app-testing/ --output /dev/null
          curl --fail --retry 3 --retry-delay 2 --max-time 15 https://poliklot.ru/og-mobile-testing-2026-09-v2.jpg --output /dev/null
          curl --fail --retry 3 --retry-delay 2 --max-time 15 https://poliklot.ru/analytics/count.js --output /dev/null
          curl --fail --retry 3 --retry-delay 2 --max-time 15 https://poliklot.ru/og-poliklot-2026-09.jpg --output /dev/null
          curl --fail --retry 3 --retry-delay 2 --max-time 15 https://poliklot.ru/llms.txt --output /dev/null
